<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="theme-color" content="#111e38" />
	<title>Offline - Leoz</title>
	<link rel="icon" type="image/webp" href="/assets/images/logo.webp" />
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 16px;
			background: #111e38;
			color: #ffffff;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		}
		.card {
			width: 100%;
			max-width: 420px;
			background: #0b1527;
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 16px;
			padding: 28px 22px;
			text-align: center;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
		}
		.card img { width: 72px; height: 72px; border-radius: 14px; object-fit: contain; background: #fff; padding: 4px; }
		h1 { font-size: 20px; margin: 18px 0 8px; }
		p { font-size: 14px; line-height: 1.5; color: rgba(255, 255, 255, 0.75); margin: 0 0 18px; }
		.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
		a, button {
			border: 0;
			border-radius: 10px;
			padding: 10px 18px;
			font-size: 14px;
			font-weight: 600;
			cursor: pointer;
			text-decoration: none;
		}
		.primary { background: #3b82f6; color: #fff; }
		.secondary { background: rgba(255, 255, 255, 0.12); color: #fff; }
	</style>
</head>
<body>
	<div class="card">
		<img src="/assets/images/LeozLogo.jpeg" alt="Leoz" />
		<h1>You are offline</h1>
		<p>This page has not been opened on this device yet, so it is not available without internet. Pages you have opened before, and your menu pages, still work offline.</p>
		<div class="actions">
			<a class="primary" href="/Admin/Home/Index">Go to Dashboard</a>
			<button class="secondary" type="button" onclick="location.reload()">Try again</button>
		</div>
	</div>
	<script>
		// come back automatically as soon as the connection returns
		window.addEventListener('online', function () { location.reload(); });
	</script>
</body>
</html>
